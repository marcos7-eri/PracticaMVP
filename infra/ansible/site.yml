---
- hosts: all
  become: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
  tasks:
    - name: Instalar Docker, Git y firewall
      apt:
        name: [docker.io, docker-compose-v2, git, ufw, iptables-persistent]
        update_cache: true
        state: present
    - name: Activar Docker
      service: { name: docker, state: started, enabled: true }
    - name: Permitir SSH
      community.general.ufw: { rule: allow, port: '22', proto: tcp }
    - name: Permitir HTTP
      community.general.ufw: { rule: allow, port: '80', proto: tcp }
    - name: Permitir HTTPS
      community.general.ufw: { rule: allow, port: '443', proto: tcp }
    - name: Activar firewall
      community.general.ufw: { state: enabled, policy: deny }
    - name: Crear directorio de aplicación
      file: { path: /opt/parking, state: directory, mode: '0755' }
    - name: Escribir Compose
      copy:
        dest: /opt/parking/docker-compose.yml
        content: |
          services:
            frontend:
              image: {{ dockerhub_username }}/parking-frontend:latest
              restart: unless-stopped
              ports: ["80:3000"]
              depends_on: [backend]
            backend:
              image: {{ dockerhub_username }}/parking-backend:latest
              restart: unless-stopped
              volumes: ["parking_data:/app/data"]
          volumes:
            parking_data:
    - name: Descargar y arrancar imagen
      command: docker compose -f /opt/parking/docker-compose.yml up -d --pull always
      changed_when: true
