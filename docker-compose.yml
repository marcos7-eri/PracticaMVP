services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/parking-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      - backend
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/parking-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - parking_data:/app/data
    environment:
      DB_FILE: /app/data/parking.sqlite
volumes:
  parking_data:
