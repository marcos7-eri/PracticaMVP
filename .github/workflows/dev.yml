name: Pruebas DEV
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      - name: Construir imagen frontend
        run: docker build -f frontend/Dockerfile -t parking-frontend:test .
      - name: Construir imagen backend
        run: docker build -f backend/Dockerfile -t parking-backend:test .
      - uses: hashicorp/setup-terraform@v3
      - name: Validar infraestructura OCI
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
